[project]
name = "steamframe-splats"
version = "0.1.0"
description = "Pipecleaner: view a Gaussian splat scene on a Valve Steam Frame through SteamVR"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
# Exact pins: these are the versions the S3 test pattern ran against.
dependencies = [
    "pyopenxr==1.1.6501",
    "PyOpenGL==3.1.10",
    "glfw==2.11.0",
    "numpy==2.5.4",
    "torch>=2.15.0",
    "cuda-python==13.4.4",
]

[tool.uv]
# An application, not an installable package: run it with `uv run`.
package = false
